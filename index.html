<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日热门新闻</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    h1 { margin-bottom: 8px; }
    .meta { color: #6b7280; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .card h2 { margin: 0 0 10px; font-size: 1.1rem; }
    ol { margin: 0; padding-left: 18px; }
    li { margin-bottom: 10px; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .source { display:block; color:#6b7280; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>每日热门新闻</h1>
    <p class="meta" id="meta">加载中...</p>
    <div class="grid" id="news-grid"></div>
  </div>

  <script>
    async function loadNews() {
      const meta = document.getElementById('meta');
      const grid = document.getElementById('news-grid');
      try {
        const resp = await fetch('./data/news.json?ts=' + Date.now());
        if (!resp.ok) throw new Error('无法读取新闻数据');
        const data = await resp.json();

        meta.textContent = `更新时间：${data.generated_at}（UTC） · 每个分类展示前 30 条`;
        grid.innerHTML = '';

        Object.entries(data.categories).forEach(([category, items]) => {
          const card = document.createElement('section');
          card.className = 'card';
          const title = document.createElement('h2');
          title.textContent = category;
          card.appendChild(title);

          const list = document.createElement('ol');
          items.forEach(item => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = item.link;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = item.title;
            const src = document.createElement('span');
            src.className = 'source';
            src.textContent = `${item.source || '未知来源'} · ${item.published || ''}`;
            li.appendChild(a);
            li.appendChild(src);
            list.appendChild(li);
          });

          card.appendChild(list);
          grid.appendChild(card);
        });
      } catch (err) {
        meta.textContent = '加载失败：' + err.message;
      }
    }

    loadNews();
  </script>
</body>
</html>
